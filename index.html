<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task Planner</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <!-- Header & Date -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body text-center">
                        <h2 class="fw-bold text-primary">Daily Task Planner</h2>
                        <p id="current-date" class="text-muted mb-0"></p>
                    </div>
                </div>

                <!-- Task Form -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <div class="input-group">
                            <input type="text" id="task-input" class="form-control" placeholder="Add a new task...">
                            <button id="add-btn" class="btn btn-primary">Add Task</button>
                        </div>
                    </div>
                </div>

                <!-- Filter Controls -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-outline-primary active filter-btn" data-filter="all">All</button>
                        <button type="button" class="btn btn-outline-primary filter-btn" data-filter="pending">Pending</button>
                        <button type="button" class="btn btn-outline-primary filter-btn" data-filter="completed">Completed</button>
                    </div>
                </div>

                <!-- Task List Container -->
                <div class="card shadow-sm">
                    <ul id="task-list" class="list-group list-group-flush">
                        <!-- Tasks will be dynamically injected here -->
                    </ul>
                </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
